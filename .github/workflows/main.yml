name: Daily Instagram Automation

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: Europe/Istanbul
    - cron: "0 20 * * *"
      timezone: Europe/Istanbul
  workflow_dispatch:
    inputs:
      format:
        description: Publish story or post
        required: true
        default: post
        type: choice
        options:
          - story
          - post

concurrency:
  group: instagram-${{ github.event.schedule || github.event.inputs.format }}
  cancel-in-progress: false

jobs:
  story:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.format == 'story') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Instagram Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python main.py story

  post:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.format == 'post') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Instagram Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python main.py post

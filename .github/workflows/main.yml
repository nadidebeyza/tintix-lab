name: Daily Instagram Automation (Post & Story)

on:
  schedule:
    # UTC 07:00 = Türkiye 10:00 -> Story
    - cron: "0 7 * * *"
    # UTC 17:00 = Türkiye 20:00 -> Feed Post
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tintix-lab-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run-story:
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run Story Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          BRAND_HASHTAG: ${{ secrets.BRAND_HASHTAG }}
          WATERMARK_TEXT: ${{ secrets.WATERMARK_TEXT }}
        run: python story.py

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_history.json post_history.json
          git diff --staged --quiet || git commit -m "Update palette history (story)"
          git push || (git pull --rebase origin ${{ github.ref_name }} && git push)

  run-post:
    if: github.event.schedule == '0 17 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run Main Post Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          BRAND_HASHTAG: ${{ secrets.BRAND_HASHTAG }}
          WATERMARK_TEXT: ${{ secrets.WATERMARK_TEXT }}
        run: python main.py

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_history.json post_history.json
          git diff --staged --quiet || git commit -m "Update palette history (post)"
          git push || (git pull --rebase origin ${{ github.ref_name }} && git push)
